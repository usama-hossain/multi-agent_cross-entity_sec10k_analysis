trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceConnectionName: 'UtilityProjectConnection'
  resourceGroupName: 'rg-scarredentos-0001'
  location: 'eastus'

steps:
# 1. Provision the resources
- task: AzureResourceManagerTemplateDeployment@3
  name: DeployResources
  displayName: 'Provision Resources'
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: $(serviceConnectionName)
    action: 'Create Or Update Resource Group'
    resourceGroupName: $(resourceGroupName)
    location: $(location)
    templateLocation: 'Linked artifact'
    csmFile: 'infra/main.bicep'
    deploymentMode: 'Incremental'
    deploymentOutputs: 'armOutputs' # Captures Bicep outputs

# 2. Parse Bicep outputs into variables
- bash: |
    echo "Parsing Bicep outputs..."
    # Loop through each key in the JSON object
    echo '$(armOutputs)' | jq -r 'to_entries[] | "##vso[task.setvariable variable=" + .key + "]" + (.value.value | tostring)'
  displayName: 'Parse Bicep Outputs'

# 3. Print success message
- script: |
    echo "Resources successfully provisioned in $(resourceGroupName)"
    echo "OpenAI Endpoint: $(openAiEndpoint)" 
    echo "docIntelligenceEndpoint: $(docIntelligenceEndpoint)"
    echo "Function App: $(functionAppNameOut)"
  displayName: 'Print Provisioning Success'

# 4. Build deployable Function package
- task: ArchiveFiles@2
  displayName: 'Archive Function App Code'
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
    replaceExistingArchive: true

# 5. Deploy Function App package
- task: AzureFunctionApp@2
  displayName: 'Deploy Function App'
  inputs:
    connectedServiceNameARM: $(serviceConnectionName)
    appType: functionAppLinux
    appName: $(functionAppNameOut)
    package: '$(Build.ArtifactStagingDirectory)/functionapp.zip'

# 6. Final Status
- script: |
    echo "Resources provisioned and Function App deployed."
  displayName: 'Print Final Status'
  condition: always()