trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceConnectionName: 'UtilityProjectConnection'
  resourceGroupName: 'rg-scarredentos-0001'
  location: 'eastus'

steps:
# 1. Provision the resources
- task: AzureResourceManagerTemplateDeployment@3
  name: DeployResources
  displayName: 'Provision Resources'
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: $(serviceConnectionName)
    action: 'Create Or Update Resource Group'
    resourceGroupName: $(resourceGroupName)
    location: $(location)
    templateLocation: 'Linked artifact'
    csmFile: 'infra/main.bicep'
    deploymentMode: 'Incremental'
    deploymentOutputs: 'armOutputs' # Captures Bicep outputs

# 2. Parse Bicep outputs into variables
- bash: |
    echo "Parsing Bicep outputs..."
    # Loop through each key in the JSON object
    echo '$(armOutputs)' | jq -r 'to_entries[] | "##vso[task.setvariable variable=" + .key + "]" + (.value.value | tostring)'
  displayName: 'Parse Bicep Outputs'

# 3. Print success message
- script: |
    echo "Resources successfully provisioned in $(resourceGroupName)"
    echo "OpenAI Endpoint: $(openAiEndpoint)" 
    echo "docIntelligenceEndpoint: $(docIntelligenceEndpoint)"
  displayName: 'Print Provisioning Success'

# 4. Delete the Search Service
- task: AzureCLI@2
  displayName: 'Delete Search Service for Cost Control'
  condition: always()
  inputs:
    azureSubscription: $(serviceConnectionName)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      ENDPOINT="$(searchEndpoint)"
      NAME=$(echo $ENDPOINT | sed -e 's/https:\/\///' -e 's/.search.windows.net//')
      echo "Targeting Search Service: $NAME for deletion..."
      az search service delete --name "$NAME" --resource-group $(resourceGroupName) --yes
      echo "Search Service $NAME has been successfully deleted."

# 5. Final Status (FIXED INDENTATION)
- script: |
    echo "The pipeline has completed the ephemeral test cycle."
  displayName: 'Print Final Status'
  condition: always()