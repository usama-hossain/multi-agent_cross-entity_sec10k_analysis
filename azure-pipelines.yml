trigger:
- main

pool:
  name: 'CloudAgentPool'

variables:
  serviceConnectionName: 'UtilityProjectConnection'
  resourceGroupName: 'rg-scarredentos-0001'
  location: 'eastus'

steps:
# 1. Provision the resources using your Bicep file
- task: AzureResourceManagerTemplateDeployment@3
  # Added name so we can reference its outputs
  # ***What is DeployResources?
  name: DeployResources 
  displayName: 'Provision Resources'
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: $(serviceConnectionName)
    action: 'Create Or Update Resource Group'
    resourceGroupName: $(resourceGroupName)
    location: $(location)
    templateLocation: 'Linked artifact'
    csmFile: 'infra/main.bicep'
    deploymentMode: 'Incremental'
    deploymentOutputs: 'armOutputs'

# Print success message after provisioning
- script: |
    echo "Resource defined in infra/main.bicep have been successfully provisioned in $(resourceGroupName)"
    echo "OpenAI Endpoint: $(DeployResources.openAiEndpoint)"
  displayName: 'Print Provisioning Success'

# 3. Delete the specific Search Service resource
- task: AzureCLI@2
  displayName: 'Delete Search Service for Cost Control'
  # Ensures cleanup runs even if provisioning or script steps fail
  condition: always()
  inputs:
    azureSubscription: $(serviceConnectionName)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Extract the search name from the full endpoint URL provided in Bicep output
      SEARCH_ENDPOINT="$(DeployResources.searchEndpoint)"
      SEARCH_NAME=$(echo $SEARCH_ENDPOINT | sed -e 's/https:\/\///' -e 's/.search.windows.net//')

      echo "Targeting Search Service: $SEARCH_NAME for deletion..."

      az search service delete --name $SEARCH_NAME --resource-group $(resourceGroupName)

      echo "Search Service $SEARCH_NAME has been successfully deleted to minimize costs."
    
- script: |
    echo "The pipeline has completed the ephemeral test cycle. The resource group $(resourceGroupName) remains, but the search service has been removed"
    displayName: 'Print Final Status'
    condition: always()